","The game loop"],"help.loop.b":["V\xE4lj tema, genre och plattform, f\xF6rdela fokus och l\xE5t teamet bygga spelet i tre faser plus polering. Sen kommer recensionerna och pengarna rullar in under m\xE5naderna efter lansering.","Pick a topic, genre and platform, set your focus and let the team build the game in three phases plus polish. Then come the reviews and the money rolls in over the months after launch."],"help.score.t":["S\xE5 s\xE4tts betyget","How the score works"],"help.score.b":["Teamets design- och teknikpo\xE4ng j\xE4mf\xF6rs med vad spelets storlek och eran kr\xE4ver. Bra tema/genre-kombinationer, r\xE4tt fokus, f\xE5 buggar och en passande plattform lyfter betyget.","Your team's design and tech points are compared with what the game's scope and era demand. Good topic/genre combos, the right focus, few bugs and a fitting platform lift the score."],"help.focus.t":["Fokus","Focus"],"help.focus.b":["Varje genre vill ha en egen balans mellan kategorierna. Du l\xE4r dig idealet genom att sl\xE4ppa spel i genren. Recensionens anteckningar visar vad som var fel.","Each genre wants its own balance between categories. You learn the ideal by releasing games in the genre. The review's studio notes tell you what was off."],"help.research.t":["Forskning","Research"],"help.research.b":["Forskningspo\xE4ng samlas av teamet. Anv\xE4nd dem f\xF6r att l\xE5sa upp nya teman, genrer, kategorier, st\xF6rre spel och teknik.","Research points are earned by your team. Spend them to unlock new topics, genres, categories, bigger games and tech."],"help.team.t":["Team och kontor","Team and office"],"help.team.b":["Fler och b\xE4ttre medarbetare ger h\xF6gre kvalitet men kostar l\xF6n varje m\xE5nad. Bygg ut kontoret f\xF6r fler skrivbord och anl\xE4ggningar som forskningslabb och QA. Ett st\xF6rre kontor m\xE5ste f\xF6rtj\xE4nas: kr\xE4ver utgivna spel, bra betyg, fans, ett fullt team och pengar. Studiof\xF6nstret visar hur l\xE5ngt du kommit.","More and better staff means hi
