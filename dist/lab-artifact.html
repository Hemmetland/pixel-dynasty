\xE4r","Visionary"],"arch.visionary.d":["Forskar snabbare och ser trender.","Researches faster and spots trends."],"arch.hustler":["Aff\xE4rsm\xE4nniska","Hustler"],"arch.hustler.d":["Snabb och med lite extra startkapital.","Quick, with some extra starting cash."],"diff.relaxed":["Avslappnat","Relaxed"],"diff.relaxed.d":["Mer pengar, h\xF6gre f\xF6rs\xE4ljning och f\xE4rre buggar.","More money, higher sales and fewer bugs."],"diff.normal":["Normal","Normal"],"diff.normal.d":["Som t\xE4nkt.","As intended."],"diff.hardcore":["H\xE5rdkokt","Hardcore"],"diff.hardcore.d":["Mindre pengar, dyrare personal och fler buggar.","Less money, pricier staff and more bugs."],"intro.1":["Ett garage. En dator. En dr\xF6m.","A garage. A computer. A dream."],"intro.2":["Spelbranschen \xE4r bara i sin linda.","The games industry is only just beginning."],"intro.3":["G\xF6r ett spel. Sedan ett till. Bygg en dynasti.","Make a game. Then another. Build a dynasty."],"intro.skip":["Klicka f\xF6r att hoppa \xF6ver","Click to skip"],"tut.ok":["Uppfattat","Got it"],"tut.skip":["St\xE4ng handledning","Skip tutorial"],"tut.create.h":["G\xF6r ditt f\xF6rsta spel","Make your first game"],"tut.create.b":["Klicka p\xE5 <b>Nytt spel</b> i menyn nedan. V\xE4lj tema, genre och plattform.","Click <b>New game</b> in the bar below. Pick a topic, genre and platform."],"tut.dev.h":["Utveckling p\xE5g\xE5r","Development under way"],"tut.dev.b":["Bl\xE5 siffror \xE4r <b>design</b>, gr\xF6na \xE4r <b>teknik</b> och r\xF6da \xE4r <b>buggar</b>. N\xE4r en ny fas b\xF6rjar v\xE4ljer du nytt fokus.","Blue numbers are <b>design</b>, green are <b>tech</b> and red are <b>bugs</b>. When a new phase starts you pick a new focus."],"tut.research.h":["Dags att forska","Time to research"],"tut.research.b":["\xD6ppna <b>Forska</b> och starta n\xE5got. Nya teman, genrer och funktioner l\xE5ses upp.","Open <b>Research</b> and start something. New topics, genres and features unlock."],"tut.again.h":["N\xE4sta spel!","Next game!
