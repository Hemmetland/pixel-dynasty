r games and tech."],"help.team.t":["Team och kontor","Team and office"],"help.team.b":["Fler och b\xE4ttre medarbetare ger h\xF6gre kvalitet men kostar l\xF6n varje m\xE5nad. Bygg ut kontoret f\xF6r fler skrivbord och anl\xE4ggningar som forskningslabb och QA. Ett st\xF6rre kontor m\xE5ste f\xF6rtj\xE4nas: kr\xE4ver utgivna spel, bra betyg, fans, ett fullt team och pengar. Studiof\xF6nstret visar hur l\xE5ngt du kommit.","More and better staff means higher quality but costs salary every month. Expand the office for more desks and facilities like a research lab and QA. A bigger office has to be earned: it takes released games, good reviews, fans, a full team and cash. The Studio window shows your progress."],"help.market.t":["Marknaden","The market"],"help.market.b":["Plattformar kommer och g\xE5r. K\xF6p licens i tid, f\xF6lj trender och se hur dina spel st\xE5r sig mot konkurrenterna p\xE5 topplistan.","Platforms come and go. Buy licenses in time, follow trends and see how your games stack up against rivals on the charts."],"help.money.t":["Pengar","Money"],"help.money.b":["L\xF6ner, hyra och driftskostnader dras varje m\xE5nad. H\xE5ll koll p\xE5 ekonomin. \xC4r kassan negativ i tre m\xE5nader ringer banken, och n\xE4sta g\xE5ng g\xE5r studion i konkurs. Uppdrag och l\xE5n kan r\xE4dda dig.","Salaries, rent and upkeep are paid every month. Watch your cash. If it stays negative for three months the bank calls, and the next time the studio goes bankrupt. Contracts and loans can save you."],"help.goal.t":["M\xE5let","The goal"],"help.goal.b":["Bygg en studio fr\xE5n garaget \xE5r 1980 till ett torn i spelbranschens topp. Vinn priser, bli \xE4lskad av fansen och \xF6verlev i fyrtio \xE5r.","Grow a studio from the garage in 1980 into a tower at the top of the games industry. Win awards, be loved by fans and survive for forty years."],"title.pre":["Ett tycoonspel","A studio tycoon"],"title.tag":["Fr\xE5n garage till spelimperium.","From garage to game empire."],"title.c
