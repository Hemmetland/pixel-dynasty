name: Testfeedback / Test feedback
description: Berätta vad du tyckte om Pixel Dynasty / Tell us what you thought
labels: [testfeedback]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Typ / Type
      options: [Bugg / Bug, Förvirrande / Confusing, Känsla / Feel (för stressigt, trist, ...), Idé / Idea, Beröm / Praise]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: Vad hände eller vad tyckte du? / What happened or what did you think?
    validations: { required: true }
  - type: textarea
    id: when
    attributes:
      label: Var i spelet? (år, vad du gjorde) / Where in the game?
  - type: input
    id: platform
    attributes:
      label: Dator / Computer (Windows, Mac) och spelversion
  - type: textarea
    id: save
    attributes:
      label: Exportkod (valfritt) / Export code (optional)
      description: Spelet har Inställningar › Exportera. Klistra in koden om du vill att vi ska kunna ladda din save.
